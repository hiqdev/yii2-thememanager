name: Psalm Static Analysis

on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  psalm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.4' ]
    name: PHP ${{ matrix.php }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}

      # The legacy hidev dev tools pull in a Composer 1 era config plugin;
      # Composer 2 skips it, but its plugin-API constraint must be ignored to resolve.
      - name: Composer install
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install -n --ignore-platform-req=composer-plugin-api

      - name: Run Psalm
        run: vendor/bin/psalm
